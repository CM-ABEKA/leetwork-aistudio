version: '3.8'

services:
  # ============================================
  # DATABASE SERVICES
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: ml-platform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leetuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DB:-leetstudio}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leetuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml-platform-network
    restart: unless-stopped

  # ============================================
  # CACHE & QUEUE SERVICES
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ml-platform-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml-platform-network
    restart: unless-stopped

  # ============================================
  # OBJECT STORAGE
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: ml-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ml-platform-network
    restart: unless-stopped

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: ml-platform-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      /usr/bin/mc mb myminio/ml-platform --ignore-existing;
      /usr/bin/mc anonymous set download myminio/ml-platform;
      exit 0;
      "
    networks:
      - ml-platform-network

  # ============================================
  # BACKEND SERVICES
  # ============================================
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: ml-platform-auth
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-leetuser}:${POSTGRES_PASSWORD:-test}@postgres:5432/${POSTGRES_DB:-leetstudio}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ml-platform-network
    restart: unless-stopped
    # Uncomment when Dockerfile is ready
    # command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  orchestrator-service:
    build:
      context: ./backend/orchestrator-service
      dockerfile: Dockerfile
    container_name: ml-platform-orchestrator
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-leetuser}:${POSTGRES_PASSWORD:-test}@postgres:5432/${POSTGRES_DB:-leetstudio}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-ml-platform}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - AUTH_SERVICE_URL=http://auth-service:8001
    ports:
      - "${ORCHESTRATOR_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - ml-platform-network
    restart: unless-stopped
    # Uncomment when Dockerfile is ready
    # command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  ml-classical-service:
    build:
      context: ./backend/ml-classical-service
      dockerfile: Dockerfile
    container_name: ml-platform-ml-classical
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-ml-platform}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    ports:
      - "${ML_CLASSICAL_PORT:-8010}:8010"
    depends_on:
      - minio
    networks:
      - ml-platform-network
    restart: unless-stopped
    # Uncomment when Dockerfile is ready
    # command: uvicorn main:app --host 0.0.0.0 --port 8010 --reload

  # ============================================
  # CELERY WORKERS
  # ============================================
  celery-worker-cpu:
    build:
      context: ./backend/orchestrator-service
      dockerfile: Dockerfile
    container_name: ml-platform-celery-cpu
    command: celery -A celery_app worker --loglevel=info -Q cpu_queue --concurrency=4 --hostname=worker-cpu@%h
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-leetuser}:${POSTGRES_PASSWORD:-test}@postgres:5432/${POSTGRES_DB:-leetstudio}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-ml-platform}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ml-platform-network
    restart: unless-stopped
    # Uncomment when celery_app is ready
    # profiles: ["workers"]

  celery-beat:
    build:
      context: ./backend/orchestrator-service
      dockerfile: Dockerfile
    container_name: ml-platform-celery-beat
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-leetuser}:${POSTGRES_PASSWORD:-test}@postgres:5432/${POSTGRES_DB:-leetstudio}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ml-platform-network
    restart: unless-stopped
    # Uncomment when celery_app is ready
    # profiles: ["workers"]

  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ml-platform-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8002}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8002}
      - NODE_ENV=development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - orchestrator-service
    networks:
      - ml-platform-network
    restart: unless-stopped
    # Uncomment when Next.js is set up
    # command: npm run dev

  # ============================================
  # MONITORING (Optional - uncomment to enable)
  # ============================================
