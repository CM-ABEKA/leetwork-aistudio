version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Use strong password from .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_prod:/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  auth-service:
    build:
      target: production
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - LOG_LEVEL=INFO
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8001
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
      replicas: 2

  orchestrator-service:
    build:
      target: production
    environment:
      - LOG_LEVEL=INFO
      - MINIO_SECURE=true
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8002
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
      replicas: 2

  ml-classical-service:
    build:
      target: production
    environment:
      - LOG_LEVEL=INFO
      - MINIO_SECURE=true
    command: gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8010 --timeout 300
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
      replicas: 1

  celery-worker-cpu:
    command: celery -A celery_app worker --loglevel=warning -Q cpu_queue --concurrency=8 --max-tasks-per-child=100 --hostname=worker-cpu@%h
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
      replicas: 2

  celery-beat:
    command: celery -A celery_app beat --loglevel=warning
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      target: production
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_TELEMETRY_DISABLED=1
    command: npm start
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
      replicas: 2

  # Production-only services
  nginx:
    image: nginx:alpine
    container_name: ml-platform-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - orchestrator-service
    networks:
      - ml-platform-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: ml-platform-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    networks:
      - ml-platform-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  grafana:
    image: grafana/grafana:latest
    container_name: ml-platform-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - ml-platform-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data_prod:
    name: ml-platform-postgres-data-prod
  redis_data_prod:
    name: ml-platform-redis-data-prod
  minio_data_prod:
    name: ml-platform-minio-data-prod
  prometheus_data_prod:
    name: ml-platform-prometheus-data-prod
  grafana_data_prod:
    name: ml-platform-grafana-data-prod
  nginx_cache:
    name: ml-platform-nginx-cache
